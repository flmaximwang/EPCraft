<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>凝胶电泳图 · 标签编辑器</title>
<!--
  这个文件由 templates/editor.html 生成（spec §6）：只有两个占位符
  （scene JSON 与胶面 data URI）。全部 CSS/JS 内联，无网络、无外部字体，
  可以直接从 file:// 打开。

  脚本块 #core 是 scene.py 的浏览器双胞胎，也是它的唯一描述：
    pageSizeCm / itemBoxCm / pagePx / sceneToSvg / insertPhys
  脚本块 #ui 只做 DOM 应用，不参与几何。

  与 Python 有意保持一致的细节：
    * 字号像素 = max(6, round(size_pt / 72 * scene.output.dpi))，与 scene._cm_box_size 同口径；
    * 页面规则 = 胶面 + 每边 max(margin_min_cm, 文字越界 + pad_cm)；
    * pagePx 的宽度 = faceW + L + R、高度 = faceH + T + B（与 cmd_export 的取整顺序一致）。
  与 ticket 措辞的唯一有意差异：
    * ticket 说 scene 存的是“墨迹框”；实际 scene.py 现在存的是 text_layout.text_extent() 的
      回退值 width=int(len(text)*0.55*px)、height=px（magick label 调用缺 info: 走了 except）。
      为了让页面尺寸、胶面偏移和 pagePx 与 Python 逐像素一致（spec §8），JS 照抄这两个回退值；
      canvas measureText 只用来取 fontBoundingBoxAscent，把 baseline 放到与 ImageMagick
      -annotate 相同的位置。若将来 text_extent 改成真实 ink box，只改 _metrics() 的 w/h 两行。
-->
<style>
:root{
  --bg:#eef1f5; --chrome:#ffffff; --chrome2:#f6f8fa; --line:#d7dde5;
  --text:#1f2937; --muted:#6b7280; --accent:#2563eb; --accent2:#dbeafe;
  --shadow:0 10px 30px rgba(15,23,42,.16);
}
body.dark{
  --bg:#151a21; --chrome:#1d232c; --chrome2:#242c37; --line:#38424f;
  --text:#e5e9ef; --muted:#98a3b3; --accent:#60a5fa; --accent2:#1e3a5f;
  --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
button,input,select,textarea{font:inherit;color:inherit}
button{
  background:var(--chrome2); border:1px solid var(--line); border-radius:6px;
  padding:5px 9px; cursor:pointer;
}
button:hover:not(:disabled){border-color:var(--accent); color:var(--accent)}
button:disabled{opacity:.45; cursor:default}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff}
button.primary:hover{filter:brightness(1.08); color:#fff}
#bar{
  position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center;
  gap:10px 18px; padding:8px 14px; background:var(--chrome);
  border-bottom:1px solid var(--line); box-shadow:0 1px 0 rgba(0,0,0,.03);
}
#bar .brand{font-weight:600; letter-spacing:.02em; margin-right:4px; white-space:nowrap}
#bar .group{display:flex; align-items:center; gap:6px}
#bar label{display:flex; align-items:center; gap:4px; color:var(--muted)}
#bar input[type=number]{width:64px}
#bar select{padding:4px 6px; border:1px solid var(--line); border-radius:6px; background:var(--chrome2)}
main{display:grid; grid-template-columns:minmax(0,1fr) 280px; height:calc(100% - 49px)}
#workspace{overflow:auto; position:relative}
#sheet{
  display:grid; grid-template-columns:24px auto; grid-template-rows:24px auto;
  width:max-content; margin:20px; user-select:none;
}
#ruler-top{grid-column:2; grid-row:1; position:relative; border-bottom:1px solid var(--line)}
#ruler-left{grid-column:1; grid-row:2; position:relative; border-right:1px solid var(--line)}
#ruler-top .ticks,#ruler-left .ticks{position:absolute; inset:0}
.tick{position:absolute; background:var(--muted); opacity:.55}
#ruler-top .tick{bottom:0; width:1px; height:4px}
#ruler-top .tick.major{height:9px; opacity:.9}
#ruler-left .tick{left:0; height:1px; width:4px}
#ruler-left .tick.major{width:9px; opacity:.9}
.tick-label{position:absolute; font-size:9px; color:var(--muted); line-height:1}
#ruler-top .tick-label{top:1px; transform:translateX(-50%)}
#ruler-left .tick-label{left:10px; transform:translateY(-50%)}
#stage{
  grid-column:2; grid-row:2; position:relative; background:#fff;
  box-shadow:var(--shadow); overflow:visible;
}
#stage.adding{cursor:crosshair; outline:2px dashed var(--accent); outline-offset:2px}
#gel{
  position:absolute; left:0; top:0; pointer-events:none; user-select:none;
  -webkit-user-drag:none; image-rendering:auto;
}
#labels{position:absolute; inset:0; pointer-events:none}
.label{
  position:absolute; white-space:pre; line-height:1; color:#000; cursor:move;
  font-family:Arial,Helvetica,sans-serif; pointer-events:auto; user-select:none;
  text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff;
}
.label.role-free{font-style:italic}
.label.selected{outline:1px solid var(--accent); outline-offset:3px; background:rgba(37,99,235,.09)}
.label.editing{
  cursor:text; outline:1px dashed var(--accent); outline-offset:3px;
  background:rgba(37,99,235,.14); user-select:text; text-shadow:none;
}
#panel{
  border-left:1px solid var(--line); background:var(--chrome);
  padding:12px 14px; overflow:auto;
}
#panel hr{border:0; border-top:1px solid var(--line); margin:14px 0}
.panel-head{font-weight:600; margin-bottom:6px}
.muted{color:var(--muted)}
.hint{color:var(--muted); margin:4px 0 10px; font-size:12px}
.field{display:block; margin:8px 0}
.field input,.field select,.field textarea{
  width:100%; margin-top:3px; padding:4px 6px; border:1px solid var(--line);
  border-radius:6px; background:var(--chrome2); color:var(--text);
}
.field textarea{resize:vertical; min-height:42px}
.row{display:flex; gap:6px; align-items:flex-end; margin:8px 0}
.row .field{flex:1; margin:0}
.row button{white-space:nowrap}
#selection-info{margin-bottom:4px}
#p-meta,#page-info{font-size:12px; margin-top:4px}
#status{
  position:fixed; left:50%; bottom:18px; transform:translateX(-50%) translateY(10px);
  max-width:calc(100vw - 40px); padding:7px 14px; border-radius:999px;
  background:rgba(17,24,39,.92); color:#fff; font-size:12px;
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:50;
}
#status.show{opacity:1; transform:translateX(-50%) translateY(0)}
#status.error{background:#b91c1c}
@media (max-width:800px){
  main{grid-template-columns:1fr; height:auto}
  #panel{border-left:0; border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<header id="bar">
  <div class="brand">凝胶电泳图 · 标签编辑器</div>
  <div class="group">
    <button id="btn-undo" title="撤销 (Ctrl/Cmd+Z)" disabled>↶ 撤销</button>
    <button id="btn-redo" title="重做 (Shift+Ctrl/Cmd+Z)" disabled>↷ 重做</button>
  </div>
  <div class="group">
    <button id="btn-add" title="点一下画布放置新标签">＋ 添加文字</button>
    <button id="btn-del" title="删除选中的标签 (Delete)">删除</button>
  </div>
  <div class="group">
    <label>缩放
      <select id="zoom">
        <option value="fit">适应</option>
        <option value="0.5">50%</option>
        <option value="0.75">75%</option>
        <option value="1">100%</option>
        <option value="1.5">150%</option>
        <option value="2">200%</option>
        <option value="3">300%</option>
        <option value="4">400%</option>
      </select>
    </label>
    <button id="btn-theme" title="只换界面配色，图始终白底">深色</button>
  </div>
  <div class="group">
    <label>dpi <input id="dpi" type="number" min="30" max="2400" step="1"></label>
    <button id="btn-png" class="primary">下载 PNG</button>
    <button id="btn-svg">下载 SVG</button>
    <button id="btn-save">保存 HTML</button>
    <button id="btn-json">scene JSON</button>
  </div>
</header>

<main>
  <section id="workspace">
    <div id="sheet">
      <div id="ruler-top"><div class="ticks" id="ticks-top"></div></div>
      <div id="ruler-left"><div class="ticks" id="ticks-left"></div></div>
      <div id="stage">
        <img id="gel" src="__GEL_DATA_URI__" alt="">
        <div id="labels"></div>
      </div>
    </div>
  </section>

  <aside id="panel">
    <div class="panel-head">标签属性</div>
    <div id="selection-info" class="muted">未选中标签</div>
    <label class="field">文字
      <textarea id="p-text" rows="2" disabled></textarea>
    </label>
    <div class="row">
      <label class="field">字号 (pt)
        <input id="p-size" type="number" min="1" max="200" step="0.5" disabled>
      </label>
      <label class="field">颜色
        <input id="p-color" type="color" value="#000000" disabled>
      </label>
    </div>
    <label class="field">锚点
      <select id="p-anchor" disabled>
        <option value="top-left">top-left</option>
        <option value="top-center">top-center</option>
        <option value="top-right">top-right</option>
        <option value="middle-left">middle-left</option>
        <option value="middle-center">middle-center</option>
        <option value="middle-right">middle-right</option>
        <option value="bottom-left">bottom-left</option>
        <option value="bottom-center">bottom-center</option>
        <option value="bottom-right">bottom-right</option>
      </select>
    </label>
    <div id="p-meta" class="muted"></div>
    <hr>
    <div class="panel-head">批量</div>
    <p class="hint">把下面的大小 / 颜色套到所有 lane 或所有 marker 标签。</p>
    <div class="row">
      <label class="field">字号
        <input id="b-size" type="number" min="1" max="200" step="0.5" value="8">
      </label>
      <button id="b-size-lane">→ lane</button>
      <button id="b-size-marker">→ marker</button>
    </div>
    <div class="row">
      <label class="field">颜色
        <input id="b-color" type="color" value="#000000">
      </label>
      <button id="b-color-lane">→ lane</button>
      <button id="b-color-marker">→ marker</button>
    </div>
    <hr>
    <div class="panel-head">说明</div>
    <p class="hint">
      胶面图是锁定的（不能选中、移动、隐藏或删除）；拼接缝属于胶面，也会一起保留。
      页面会随文字自动伸缩。浏览器的“保存”不能覆盖打开的文件，所以“保存 HTML”
      会下载一份带当前编辑的新文件。
    </p>
    <div id="page-info" class="muted"></div>
  </aside>
</main>

<div id="status" role="status"></div>

<script type="application/json" id="scene">__SCENE_JSON__</script>
<script id="core">
/* ------------------------------------------------------------------
 * scene.py 的 JS 双胞胎（纯函数，加载时不碰 DOM）。
 * 规则与 scene.item_box_cm / page_size_cm / cmd_export 一一对应。
 * 见文件顶部注释里说明的唯一有意差异（em 框 vs 字形墨迹）。
 * ------------------------------------------------------------------ */
(function (root) {
  "use strict";

  var SVG_NS = "http" + "://www.w3.org/2000/svg";
  var XLINK_NS = "http" + "://www.w3.org/1999/xlink";
  var _ctx = null;
  var _cache = {};

  function _sceneDpi(scene) {
    var d = scene && scene.output && scene.output.dpi;
    return d ? +d : 96;
  }

  function _family(scene) {
    var f = (scene && scene.font && scene.font.family) || "Arial";
    return /[\s,]/.test(f) ? '"' + String(f).replace(/"/g, "") + '"' : f;
  }

  function _fontPx(scene, item) {
    return Math.max(6, Math.round((+item.size_pt || 0) / 72 * _sceneDpi(scene)));
  }

  function _ctx2d() {
    if (_ctx) return _ctx;
    try {
      if (typeof OffscreenCanvas !== "undefined") {
        _ctx = new OffscreenCanvas(8, 8).getContext("2d");
      } else if (typeof document !== "undefined") {
        _ctx = document.createElement("canvas").getContext("2d");
      }
    } catch (e) {
      _ctx = null;
    }
    return _ctx;
  }

  // 一条标签的度量（cm）。这里刻意**照抄 scene.py 现在实际存下来的盒子**：
  //   text_layout.text_extent() 的 magick 调用少了 `info:`，异常后走回退分支，
  //   于是 scene._cm_box_size() 存的是 width = int(len(text) * 0.55 * px)、height = px。
  // 页面规则 / pagePx / 胶面偏移因此和 Python 逐像素一致（spec §8）。
  // canvas 仍然量一次字：fontBoundingBoxAscent 用来把 <text>/canvas 的 baseline
  // 放到与 ImageMagick -annotate 相同的位置（annotate 的 y 是框顶，baseline = y + ascent）。
  // 若将来 text_extent 改回真实墨迹，只改 _metrics() 里的 w/h 两行即可。
  function _metrics(scene, item) {
    var family = _family(scene);
    var dpi = _sceneDpi(scene);
    var px = _fontPx(scene, item);
    var text = item.text == null ? "" : String(item.text);
    var key = dpi + "|" + family + "|" + px + "|" + text;
    if (_cache[key]) return _cache[key];

    var w = Math.floor(text.length * 0.55 * px);   // scene.py 的回退宽度
    var h = px;                                    // scene.py 的回退高度
    var fontAsc = px * 0.72;
    var inkW = w;
    var ctx = _ctx2d();
    if (ctx) {
      ctx.font = px + "px " + family;
      var m = ctx.measureText(text);
      fontAsc = m.fontBoundingBoxAscent != null ? m.fontBoundingBoxAscent
        : (m.actualBoundingBoxAscent != null ? m.actualBoundingBoxAscent : px * 0.72);
      inkW = (m.actualBoundingBoxLeft || 0) + (m.actualBoundingBoxRight != null
        ? m.actualBoundingBoxRight : (m.width || 0));
    }
    fontAsc = Math.min(Math.max(fontAsc, 0), px);

    var cm = 2.54 / dpi;
    var out = {
      width_cm: w * cm, height_cm: h * cm,
      ascent_cm: fontAsc * cm, descent_cm: (px - fontAsc) * cm,
      ink_width_cm: inkW * cm,
      size_px: px, font: px + "px " + family
    };
    _cache[key] = out;
    return out;
  }

  var AXIS_V = ["top", "middle", "bottom"];
  var AXIS_H = ["left", "center", "right"];

  // 与 scene.norm_anchor 相同：竖-横为规范名，也收横-竖（right-middle）。
  function normAnchor(anchor) {
    var parts = String(anchor == null ? "" : anchor).split("-");
    if (parts.length !== 2) return "middle-center";
    var a = parts[0], b = parts[1], t;
    if (AXIS_H.indexOf(a) >= 0 && AXIS_V.indexOf(b) >= 0) { t = a; a = b; b = t; }
    if (AXIS_V.indexOf(a) < 0 || AXIS_H.indexOf(b) < 0) return "middle-center";
    return a + "-" + b;
  }

  function itemBoxCm(scene, item) {
    var m = _metrics(scene, item);
    var x = +item.x_cm || 0;
    var y = +item.y_cm || 0;
    var p = normAnchor(item.anchor).split("-");
    var v = p[0], h = p[1];
    var left = x - (h === "right" ? m.width_cm : h === "center" ? m.width_cm / 2 : 0);
    var top = y - (v === "bottom" ? m.height_cm : v === "middle" ? m.height_cm / 2 : 0);
    return { left: left, top: top, right: left + m.width_cm, bottom: top + m.height_cm };
  }

  function pageSizeCm(scene) {
    var gw = +(scene.gel && scene.gel.width_cm) || 0;
    var gh = +(scene.gel && scene.gel.height_cm) || 0;
    var margin = +(scene.page && scene.page.margin_min_cm) || 0;
    var pad = +(scene.page && scene.page.pad_cm) || 0;
    var need = { left: 0, right: 0, top: 0, bottom: 0 };
    (scene.items || []).forEach(function (item) {
      var b = itemBoxCm(scene, item);
      need.left = Math.max(need.left, -b.left);
      need.right = Math.max(need.right, b.right - gw);
      need.top = Math.max(need.top, -b.top);
      need.bottom = Math.max(need.bottom, b.bottom - gh);
    });
    var left = Math.max(margin, need.left + pad);
    var right = Math.max(margin, need.right + pad);
    var top = Math.max(margin, need.top + pad);
    var bottom = Math.max(margin, need.bottom + pad);
    return {
      width_cm: gw + left + right, height_cm: gh + top + bottom,
      left_cm: left, right_cm: right, top_cm: top, bottom_cm: bottom
    };
  }

  function pagePx(scene, dpi) {
    var d = +dpi || _sceneDpi(scene);
    var ppc = d / 2.54;
    var ps = pageSizeCm(scene);
    var faceW = Math.round((+(scene.gel && scene.gel.width_cm) || 0) * ppc);
    var faceH = Math.round((+(scene.gel && scene.gel.height_cm) || 0) * ppc);
    var L = Math.round(ps.left_cm * ppc);
    var R = Math.round(ps.right_cm * ppc);
    var T = Math.round(ps.top_cm * ppc);
    var B = Math.round(ps.bottom_cm * ppc);
    // 与 cmd_export 一样：先各自取整，再加起来。
    return { W: faceW + L + R, H: faceH + T + B, L: L, T: T, faceW: faceW, faceH: faceH };
  }

  function _num(v) {
    var n = Math.round((+v || 0) * 10000) / 10000;
    return String(n);
  }

  function _esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // spec §5：cm 尺寸 + cm viewBox；胶面是 <g id="gel"> 里的 <image>；
  // 每条标签先画描边副本再画正文（与 annotate_cmd 两遍一致）。
  function sceneToSvg(scene, gelDataUri) {
    var ps = pageSizeCm(scene);
    var w = _num(ps.width_cm), h = _num(ps.height_cm);
    var bg = (scene.page && scene.page.background) || "#ffffff";
    var fam = (scene.font && scene.font.family) || "Arial";
    var outline = scene.outline || {};
    var ocol = outline.color || null;
    var ow = outline.width_frac != null ? +outline.width_frac : 0.07;
    var out = [];
    out.push('<?xml version="1.0" encoding="UTF-8"?>');
    out.push('<svg xmlns="' + SVG_NS + '" xmlns:xlink="' + XLINK_NS +
      '" width="' + w + 'cm" height="' + h + 'cm" viewBox="0 0 ' + w + ' ' + h + '">');
    out.push('<rect x="0" y="0" width="' + w + '" height="' + h + '" fill="' + _esc(bg) + '"/>');
    out.push('<g id="gel"><image x="' + _num(ps.left_cm) + '" y="' + _num(ps.top_cm) +
      '" width="' + _num(scene.gel.width_cm) + '" height="' + _num(scene.gel.height_cm) +
      '" preserveAspectRatio="none" xlink:href="' + _esc(gelDataUri || "") + '"/></g>');
    out.push('<g id="labels">');
    (scene.items || []).forEach(function (item) {
      var box = itemBoxCm(scene, item);
      var m = _metrics(scene, item);
      var p = normAnchor(item.anchor).split("-");
      var v = p[0], hz = p[1];
      var x = hz === "left" ? box.left : (+item.x_cm || 0);
      var y = box.top + m.ascent_cm;          // baseline = 框顶 + 字体 ascent
      var anchor = hz === "left" ? "start" : hz === "right" ? "end" : "middle";
      var geom = 'x="' + _num(x) + '" y="' + _num(y) + '" text-anchor="' + anchor +
        '" font-family="' + _esc(fam) + '" font-size="' + _num(item.size_pt) + 'pt"';
      var main = 'id="' + _esc(item.id) + '" data-role="' + _esc(item.role) +
        '" data-bind="' + _esc(JSON.stringify(item.bind || {})) + '" ' + geom;
      var text = _esc(item.text);
      if (ocol) {
        // 描边副本只是垫在下面的装饰：不带 id / data-*，保证每条标签只有一个可寻址的 <text>。
        out.push('<text ' + geom + ' fill="' + _esc(item.color || "#000000") +
          '" stroke="' + _esc(ocol) + '" stroke-width="' + _num((+item.size_pt || 0) * ow) +
          'pt" stroke-linejoin="round">' + text + '</text>');
      }
      out.push('<text ' + main + ' fill="' + _esc(item.color || "#000000") + '">' + text + '</text>');
    });
    out.push('</g></svg>');
    return out.join("\n");
  }

  var _crcTable = null;
  function _crc() {
    if (_crcTable) return _crcTable;
    var t = new Uint32Array(256);
    for (var n = 0; n < 256; n++) {
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    _crcTable = t;
    return t;
  }

  function _crc32(bytes, start, end) {
    var t = _crc(), c = 0xFFFFFFFF;
    for (var i = start; i < end; i++) c = t[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  // PNG：在 IHDR 之后插一个 pHYs 块（ppmX = ppmY = round(dpi / 0.0254)，unit=1）。
  // 画布 API 不写物理尺寸，没有这个块 Word/PowerPoint 会按 96 dpi 摆图。
  function insertPhys(arrayBuffer, dpi) {
    var src = new Uint8Array(arrayBuffer);
    var sig = [137, 80, 78, 71, 13, 10, 26, 10];
    if (src.length < 33) throw new Error("不是 PNG：太短");
    for (var i = 0; i < 8; i++) if (src[i] !== sig[i]) throw new Error("PNG 签名不对");
    var len = (src[8] << 24) | (src[9] << 16) | (src[10] << 8) | src[11];
    var type = String.fromCharCode(src[12], src[13], src[14], src[15]);
    if (type !== "IHDR") throw new Error("PNG 第一块不是 IHDR");
    var ihdrEnd = 8 + 4 + 4 + len + 4;          // 8 + length + type + data + crc
    var ppm = Math.round((+dpi || 0) / 0.0254);
    var out = new Uint8Array(src.length + 21);
    out.set(src.subarray(0, ihdrEnd), 0);
    var o = ihdrEnd;
    out[o] = 0; out[o + 1] = 0; out[o + 2] = 0; out[o + 3] = 9;
    out[o + 4] = 112; out[o + 5] = 72; out[o + 6] = 89; out[o + 7] = 115;  // pHYs
    out[o + 8] = (ppm >>> 24) & 255; out[o + 9] = (ppm >>> 16) & 255;
    out[o + 10] = (ppm >>> 8) & 255; out[o + 11] = ppm & 255;
    out[o + 12] = (ppm >>> 24) & 255; out[o + 13] = (ppm >>> 16) & 255;
    out[o + 14] = (ppm >>> 8) & 255; out[o + 15] = ppm & 255;
    out[o + 16] = 1;
    var crc = _crc32(out, o + 4, o + 17);
    out[o + 17] = (crc >>> 24) & 255; out[o + 18] = (crc >>> 16) & 255;
    out[o + 19] = (crc >>> 8) & 255; out[o + 20] = crc & 255;
    out.set(src.subarray(ihdrEnd), ihdrEnd + 21);
    return out.buffer;
  }

  root.__editorCore = {
    pageSizeCm: pageSizeCm,
    itemBoxCm: itemBoxCm,
    pagePx: pagePx,
    sceneToSvg: sceneToSvg,
    insertPhys: insertPhys,
    normAnchor: normAnchor,
    inkMetrics: _metrics,
    fontPx: _fontPx
  };
})(typeof globalThis !== "undefined" ? globalThis : this);
</script>
<script id="ui">
(function () {
  "use strict";

  // 先留一份“静态骨架”：保存 HTML 时只替换 #scene 和 <title>，避免把运行期生成的
  // 标签 DOM 一起写回去（重新打开时会和脚本生成的那份重复）。
  var ORIGINAL_HTML = document.documentElement.outerHTML;

  var core = globalThis.__editorCore;
  var PX_PER_CM = 96 / 2.54;

  var sceneEl = document.getElementById("scene");
  var gelImg = document.getElementById("gel");
  var stage = document.getElementById("stage");
  var labelsEl = document.getElementById("labels");
  var workspace = document.getElementById("workspace");
  var statusEl = document.getElementById("status");
  var dpiEl = document.getElementById("dpi");
  var zoomEl = document.getElementById("zoom");
  var themeEl = document.getElementById("btn-theme");
  var undoEl = document.getElementById("btn-undo");
  var redoEl = document.getElementById("btn-redo");
  var addEl = document.getElementById("btn-add");
  var delEl = document.getElementById("btn-del");
  var pText = document.getElementById("p-text");
  var pSize = document.getElementById("p-size");
  var pColor = document.getElementById("p-color");
  var pAnchor = document.getElementById("p-anchor");
  var pMeta = document.getElementById("p-meta");
  var selInfo = document.getElementById("selection-info");
  var pageInfo = document.getElementById("page-info");

  var scene;
  try {
    scene = JSON.parse(sceneEl.textContent);
  } catch (e) {
    status("scene JSON 解析失败：" + e.message, true);
    return;
  }
  if (!scene.items) scene.items = [];
  if (!scene.gel) scene.gel = { image: "", width_cm: 1, height_cm: 1 };
  if (!scene.page) scene.page = { margin_min_cm: 0.43, pad_cm: 0.17, background: "#ffffff" };
  if (!scene.output) scene.output = { dpi: 300 };

  var selected = new Set();
  var editingId = null;
  var zoom = 1;
  var fitMode = true;
  var addMode = false;
  var undoStack = [];
  var redoStack = [];
  var fieldSession = false;
  var lastNudge = 0;

  var ANCHOR_T = {
    "top-left": "translate(0,0)", "top-center": "translate(-50%,0)", "top-right": "translate(-100%,0)",
    "middle-left": "translate(0,-50%)", "middle-center": "translate(-50%,-50%)", "middle-right": "translate(-100%,-50%)",
    "bottom-left": "translate(0,-100%)", "bottom-center": "translate(-50%,-100%)", "bottom-right": "translate(-100%,-100%)"
  };

  function itemById(id) {
    for (var i = 0; i < scene.items.length; i++) if (scene.items[i].id === id) return scene.items[i];
    return null;
  }

  function selectedItems() {
    return scene.items.filter(function (it) { return selected.has(it.id); });
  }

  function round(n, d) {
    var p = Math.pow(10, d || 4);
    return Math.round(n * p) / p;
  }

  function stem() {
    var name = String((scene.gel && scene.gel.image) || "figure").replace(/^.*[\\\/]/, "");
    return name.replace(/\.gel\.png$/i, "").replace(/\.png$/i, "") || "figure";
  }

  var statusTimer = null;
  function status(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = "show" + (isError ? " error" : "");
    if (statusTimer) clearTimeout(statusTimer);
    statusTimer = setTimeout(function () { statusEl.className = ""; }, 3000);
  }

  function displayScale() { return PX_PER_CM * zoom; }

  function computeFit() {
    var ps = core.pageSizeCm(scene);
    var availW = Math.max(120, workspace.clientWidth - 76);
    var availH = Math.max(120, workspace.clientHeight - 76);
    var z = Math.min(availW / (ps.width_cm * PX_PER_CM), availH / (ps.height_cm * PX_PER_CM));
    return Math.max(0.15, Math.min(4, z));
  }

  function cloneScene() { return JSON.parse(JSON.stringify(scene)); }

  function pushUndo() {
    undoStack.push(cloneScene());
    if (undoStack.length > 100) undoStack.shift();
    redoStack.length = 0;
    updateUndoButtons();
  }

  function undo() {
    if (!undoStack.length) return;
    redoStack.push(cloneScene());
    scene = undoStack.pop();
    selected.clear();
    editingId = null;
    renderAll();
    status("已撤销");
  }

  function redo() {
    if (!redoStack.length) return;
    undoStack.push(cloneScene());
    scene = redoStack.pop();
    selected.clear();
    editingId = null;
    renderAll();
    status("已重做");
  }

  function updateUndoButtons() {
    undoEl.disabled = !undoStack.length;
    redoEl.disabled = !redoStack.length;
  }

  function labelEl(id) {
    for (var i = 0; i < labelsEl.children.length; i++) {
      if (labelsEl.children[i].dataset.id === id) return labelsEl.children[i];
    }
    return null;
  }

  function placeLabel(el, it, ps, s) {
    el.style.left = ((ps.left_cm + (+it.x_cm || 0)) * s) + "px";
    el.style.top = ((ps.top_cm + (+it.y_cm || 0)) * s) + "px";
    el.style.fontSize = ((+it.size_pt || 8) / 72 * 96 * zoom) + "px";
    el.style.color = it.color || "#000000";
    el.style.transform = ANCHOR_T[core.normAnchor(it.anchor)] || "translate(-50%,-50%)";
  }

  function buildRulers(ps, s) {
    var top = document.getElementById("ticks-top");
    var left = document.getElementById("ticks-left");
    top.innerHTML = "";
    left.innerHTML = "";
    var every = s >= 26 ? 1 : (s >= 13 ? 2 : 5);

    function addTick(host, cm, vertical) {
      var major = Math.abs(cm - Math.round(cm)) < 1e-6 && (Math.round(cm) % every === 0);
      var d = document.createElement("div");
      d.className = "tick" + (major ? " major" : "");
      if (vertical) d.style.top = (cm * s) + "px";
      else d.style.left = (cm * s) + "px";
      host.appendChild(d);
      if (major) {
        var t = document.createElement("span");
        t.className = "tick-label";
        if (vertical) { t.style.top = (cm * s) + "px"; }
        else { t.style.left = (cm * s) + "px"; }
        t.textContent = Math.round(cm);
        host.appendChild(t);
      }
    }

    var i, n;
    n = Math.floor(ps.width_cm / 0.5 + 1e-9);
    for (i = 0; i <= n; i++) addTick(top, i * 0.5, false);
    n = Math.floor(ps.height_cm / 0.5 + 1e-9);
    for (i = 0; i <= n; i++) addTick(left, i * 0.5, true);
  }

  function layout() {
    var ps = core.pageSizeCm(scene);
    var s = displayScale();
    stage.style.width = (ps.width_cm * s) + "px";
    stage.style.height = (ps.height_cm * s) + "px";
    document.getElementById("ruler-top").style.width = (ps.width_cm * s) + "px";
    document.getElementById("ruler-left").style.height = (ps.height_cm * s) + "px";
    gelImg.style.left = (ps.left_cm * s) + "px";
    gelImg.style.top = (ps.top_cm * s) + "px";
    gelImg.style.width = ((+scene.gel.width_cm || 0) * s) + "px";
    gelImg.style.height = ((+scene.gel.height_cm || 0) * s) + "px";
    for (var i = 0; i < labelsEl.children.length; i++) {
      var el = labelsEl.children[i];
      var it = itemById(el.dataset.id);
      if (it) placeLabel(el, it, ps, s);
    }
    buildRulers(ps, s);
    pageInfo.textContent = "页面 " + ps.width_cm.toFixed(2) + " × " + ps.height_cm.toFixed(2) +
      " cm · 胶面 " + (+scene.gel.width_cm || 0).toFixed(2) + " × " +
      (+scene.gel.height_cm || 0).toFixed(2) + " cm";
  }

  function updateSelectionClasses() {
    for (var i = 0; i < labelsEl.children.length; i++) {
      var el = labelsEl.children[i];
      el.classList.toggle("selected", selected.has(el.dataset.id));
    }
  }

  function primaryItem() {
    for (var i = 0; i < scene.items.length; i++) {
      if (selected.has(scene.items[i].id)) return scene.items[i];
    }
    return null;
  }

  function updatePanel() {
    var items = selectedItems();
    var p = items[0] || null;
    if (!items.length) selInfo.textContent = "未选中标签";
    else if (items.length === 1) selInfo.textContent = p.role + " · " + p.id;
    else selInfo.textContent = "已选 " + items.length + " 个标签";

    pText.disabled = !p || items.length > 1;
    pSize.disabled = !p;
    pColor.disabled = !p;
    pAnchor.disabled = !p;

    if (p) {
      if (document.activeElement !== pText) pText.value = p.text;
      if (document.activeElement !== pSize) pSize.value = p.size_pt;
      if (document.activeElement !== pColor) pColor.value = p.color || "#000000";
      if (document.activeElement !== pAnchor) pAnchor.value = core.normAnchor(p.anchor);
      pMeta.textContent = "x=" + (+p.x_cm || 0).toFixed(3) + " cm · y=" +
        (+p.y_cm || 0).toFixed(3) + " cm · " + items.length + " 项";
    } else {
      pText.value = "";
      pMeta.textContent = "";
    }
  }

  function renderAll() {
    labelsEl.innerHTML = "";
    scene.items.forEach(function (it) {
      var el = document.createElement("div");
      el.className = "label role-" + it.role;
      el.dataset.id = it.id;
      el.textContent = it.text;
      el.title = it.role + " · " + it.id;
      el.addEventListener("pointerdown", onLabelPointerDown);
      el.addEventListener("dblclick", function (e) { e.preventDefault(); startEditing(it.id); });
      el.addEventListener("blur", function () { if (editingId === it.id) finishEditing(); });
      el.addEventListener("input", function () { if (editingId === it.id) onInlineInput(el, it); });
      el.addEventListener("keydown", onInlineKeyDown);
      if (selected.has(it.id)) el.classList.add("selected");
      labelsEl.appendChild(el);
    });
    if (fitMode) zoom = computeFit();
    layout();
    updatePanel();
    updateUndoButtons();
  }

  function finishEditing() {
    if (!editingId) return;
    var id = editingId;
    var el = labelEl(id);
    editingId = null;
    if (el) {
      el.contentEditable = "false";
      el.classList.remove("editing");
    }
    renderAll();
  }

  function startEditing(id, initialChar, skipUndo) {
    var it = itemById(id);
    var el = labelEl(id);
    if (!it || !el) return;
    if (editingId && editingId !== id) finishEditing();
    el = labelEl(id);
    if (!el) return;
    if (!skipUndo) pushUndo();
    editingId = id;
    el.contentEditable = "true";
    el.classList.add("editing");
    el.focus();
    if (initialChar !== undefined) {
      el.textContent = initialChar;
      it.text = initialChar;
    } else {
      var range = document.createRange();
      range.selectNodeContents(el);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
    if (document.activeElement !== pText) pText.value = it.text;
    layout();
    updatePanel();
  }

  function onInlineInput(el, it) {
    it.text = el.textContent;
    if (document.activeElement !== pText) pText.value = it.text;
    layout();
  }

  function onInlineKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      finishEditing();
    } else if (e.key === "Escape") {
      e.preventDefault();
      finishEditing();
    }
    e.stopPropagation();
  }

  function onLabelPointerDown(e) {
    if (addMode || e.button !== 0) return;
    var id = this.dataset.id;
    if (editingId) {
      if (editingId === id) return;   // 正在编辑：点到字里是放光标，不是拖动
      finishEditing();
    }
    e.preventDefault();
    e.stopPropagation();
    if (e.shiftKey) {
      if (selected.has(id)) selected.delete(id); else selected.add(id);
    } else if (!selected.has(id)) {
      selected.clear();
      selected.add(id);
    }
    updateSelectionClasses();
    updatePanel();
    startDrag(e);
  }

  function startDrag(e) {
    var startX = e.clientX, startY = e.clientY;
    var orig = selectedItems().map(function (it) {
      return { it: it, x: +it.x_cm || 0, y: +it.y_cm || 0 };
    });
    var moved = false;

    function onMove(ev) {
      var s = displayScale();
      var dx = (ev.clientX - startX) / s;
      var dy = (ev.clientY - startY) / s;
      if (!moved && (Math.abs(dx) + Math.abs(dy)) > 0.0005) {
        pushUndo();
        moved = true;
      }
      if (!moved) return;
      orig.forEach(function (o) {
        o.it.x_cm = round(o.x + dx, 6);
        o.it.y_cm = round(o.y + dy, 6);
      });
      layout();
      updatePanel();
    }

    function onUp() {
      document.removeEventListener("pointermove", onMove);
      document.removeEventListener("pointerup", onUp);
      if (moved) renderAll();
    }

    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", onUp);
  }

  function deleteSelected() {
    if (!selected.size) return;
    pushUndo();
    scene.items = scene.items.filter(function (it) { return !selected.has(it.id); });
    selected.clear();
    editingId = null;
    renderAll();
    status("已删除");
  }

  function nudge(dx, dy) {
    if (!selected.size) return;
    var now = Date.now();
    if (now - lastNudge > 600) pushUndo();
    lastNudge = now;
    scene.items.forEach(function (it) {
      if (!selected.has(it.id)) return;
      it.x_cm = round((+it.x_cm || 0) + dx, 6);
      it.y_cm = round((+it.y_cm || 0) + dy, 6);
    });
    layout();
    updatePanel();
  }

  function applyPanel(field) {
    var p = primaryItem();
    if (!p) return;
    var items = selectedItems();
    if (field === "text") {
      p.text = pText.value;
      var el = labelEl(p.id);
      if (el) el.textContent = p.text;
    } else if (field === "size") {
      var size = parseFloat(pSize.value);
      if (size > 0) items.forEach(function (it) { it.size_pt = size; });
    } else if (field === "color") {
      items.forEach(function (it) { it.color = pColor.value; });
    } else if (field === "anchor") {
      var a = core.normAnchor(pAnchor.value);
      items.forEach(function (it) { it.anchor = a; });
    }
    layout();
    updatePanel();
  }

  function beginFieldSession() {
    if (!fieldSession) { pushUndo(); fieldSession = true; }
  }

  function bulk(role, kind, value) {
    pushUndo();
    var n = 0;
    scene.items.forEach(function (it) {
      if (it.role !== role) return;
      if (kind === "size") it.size_pt = value; else it.color = value;
      n++;
    });
    renderAll();
    status("已更新 " + n + " 条 " + role + " 标签");
  }

  function downloadBlob(blob, name) {
    var a = document.createElement("a");
    var url = URL.createObjectURL(blob);
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 0);
  }

  function outlineInfo() {
    var o = scene.outline || {};
    return { color: o.color || null, widthFrac: o.width_frac != null ? +o.width_frac : 0.07 };
  }

  function drawPage(dpi) {
    var pp = core.pagePx(scene, dpi);
    var cv = document.createElement("canvas");
    cv.width = pp.W;
    cv.height = pp.H;
    // alpha:false：成品是不透明白底图。浏览器默认的 alpha 通道会让 PNG 变成
    // GrayscaleAlpha/RGBA，Word/PowerPoint 与某些期刊系统更挑剔。
    var ctx = cv.getContext("2d", { alpha: false });
    ctx.fillStyle = (scene.page && scene.page.background) || "#ffffff";
    ctx.fillRect(0, 0, pp.W, pp.H);
    ctx.drawImage(gelImg, pp.L, pp.T, pp.faceW, pp.faceH);

    var ppc = dpi / 2.54;
    var family = (scene.font && scene.font.family) || "Arial";
    var prepared = scene.items.map(function (it) {
      var box = core.itemBoxCm(scene, it);
      var m = core.inkMetrics(scene, it);
      var px = Math.max(6, Math.round((+it.size_pt || 0) / 72 * dpi));
      return {
        it: it, text: String(it.text == null ? "" : it.text),
        x: box.left * ppc, y: (box.top + m.ascent_cm) * ppc, px: px
      };
    });
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.lineJoin = "round";
    var o = outlineInfo();
    if (o.color) {
      ctx.strokeStyle = o.color;
      prepared.forEach(function (p) {
        ctx.font = p.px + "px " + family;
        ctx.lineWidth = Math.max(1, p.px * o.widthFrac);
        ctx.strokeText(p.text, p.x, p.y);
      });
    }
    prepared.forEach(function (p) {
      ctx.font = p.px + "px " + family;
      ctx.fillStyle = p.it.color || "#000000";
      ctx.fillText(p.text, p.x, p.y);
    });
    return cv;
  }

  function downloadPng() {
    var dpi = parseInt(dpiEl.value, 10);
    if (!(dpi >= 30 && dpi <= 2400)) {
      status("dpi 要在 30–2400 之间", true);
      return;
    }
    try {
      var cv = drawPage(dpi);
      cv.toBlob(function (blob) {
        if (!blob) { status("PNG 生成失败", true); return; }
        blob.arrayBuffer().then(function (ab) {
          var withPhys = core.insertPhys(ab, dpi);
          downloadBlob(new Blob([withPhys], { type: "image/png" }),
            stem() + "-edited-" + dpi + "dpi.png");
          status("已下载 " + stem() + "-edited-" + dpi + "dpi.png");
        }).catch(function (e) { status("加 pHYs 失败：" + e.message, true); });
      }, "image/png");
    } catch (e) {
      status("PNG 生成失败：" + e.message, true);
    }
  }

  function downloadSvg() {
    try {
      var svg = core.sceneToSvg(scene, gelImg.src);
      downloadBlob(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }),
        stem() + "-edited.svg");
      status("已下载 " + stem() + "-edited.svg");
    } catch (e) {
      status("SVG 生成失败：" + e.message, true);
    }
  }

  function saveHtml() {
    var json = JSON.stringify(scene, null, 2) + "\n";
    // `<` 写成 JSON 的 \u003c：标签文字里出现 script 结束标记或 HTML 注释开头也不会破坏这份文件。
    json = json.replace(/</g, "\\u003c");
    var html = ORIGINAL_HTML.replace(
      /(<script\b[^>]*\bid\s*=\s*["']scene["'][^>]*>)[\s\S]*?(<\/script>)/i,
      function (_m, open, close) { return open + json + close; });
    var title = stem() + "-edited · 已编辑";
    html = html.replace(/<title>[\s\S]*?<\/title>/i, "<title>" + title + "</title>");
    downloadBlob(new Blob([html], { type: "text/html;charset=utf-8" }), stem() + "-edited.html");
    status("已保存 " + stem() + "-edited.html（重新打开可继续编辑）");
  }

  function saveJson() {
    var json = JSON.stringify(scene, null, 2) + "\n";
    downloadBlob(new Blob([json], { type: "application/json;charset=utf-8" }),
      stem() + "-edited.scene.json");
    status("已下载 " + stem() + "-edited.scene.json");
  }

  // ---- 事件接线 ---------------------------------------------------------
  undoEl.addEventListener("click", undo);
  redoEl.addEventListener("click", redo);
  delEl.addEventListener("click", deleteSelected);
  document.getElementById("btn-png").addEventListener("click", downloadPng);
  document.getElementById("btn-svg").addEventListener("click", downloadSvg);
  document.getElementById("btn-save").addEventListener("click", saveHtml);
  document.getElementById("btn-json").addEventListener("click", saveJson);
  themeEl.addEventListener("click", function () {
    document.body.classList.toggle("dark");
    themeEl.textContent = document.body.classList.contains("dark") ? "浅色" : "深色";
  });

  addEl.addEventListener("click", function () {
    addMode = !addMode;
    stage.classList.toggle("adding", addMode);
    status(addMode ? "点击画布放置新标签（Esc 取消）" : "已取消添加");
  });

  stage.addEventListener("click", function (e) {
    if (!addMode) return;
    if (e.target && e.target.closest && e.target.closest(".label")) return;
    var rect = stage.getBoundingClientRect();
    var s = displayScale();
    var ps = core.pageSizeCm(scene);
    var x = (e.clientX - rect.left) / s - ps.left_cm;
    var y = (e.clientY - rect.top) / s - ps.top_cm;
    var n = 1;
    var ids = {};
    scene.items.forEach(function (it) { ids[it.id] = 1; });
    while (ids["free-" + n]) n++;
    pushUndo();
    var it = {
      id: "free-" + n, role: "free", bind: {}, text: "新标签",
      x_cm: round(x, 4), y_cm: round(y, 4), anchor: "middle-center",
      size_pt: 8, color: "#000000"
    };
    scene.items.push(it);
    selected.clear();
    selected.add(it.id);
    addMode = false;
    stage.classList.remove("adding");
    renderAll();
    startEditing(it.id, undefined, true);
  });

  zoomEl.addEventListener("change", function () {
    if (zoomEl.value === "fit") {
      fitMode = true;
      zoom = computeFit();
    } else {
      fitMode = false;
      zoom = parseFloat(zoomEl.value) || 1;
    }
    layout();
  });

  window.addEventListener("resize", function () {
    if (!fitMode) return;
    zoom = computeFit();
    layout();
  });

  [pText, pSize, pColor, pAnchor].forEach(function (el) {
    el.addEventListener("input", function () {
      beginFieldSession();
      applyPanel(el === pText ? "text" : el === pSize ? "size" : el === pColor ? "color" : "anchor");
    });
    el.addEventListener("change", function () {
      applyPanel(el === pText ? "text" : el === pSize ? "size" : el === pColor ? "color" : "anchor");
    });
    el.addEventListener("blur", function () {
      if (fieldSession) { fieldSession = false; renderAll(); }
    });
  });

  document.getElementById("b-size-lane").addEventListener("click", function () {
    var v = parseFloat(document.getElementById("b-size").value);
    if (v > 0) bulk("lane", "size", v);
  });
  document.getElementById("b-size-marker").addEventListener("click", function () {
    var v = parseFloat(document.getElementById("b-size").value);
    if (v > 0) bulk("marker", "size", v);
  });
  document.getElementById("b-color-lane").addEventListener("click", function () {
    bulk("lane", "color", document.getElementById("b-color").value);
  });
  document.getElementById("b-color-marker").addEventListener("click", function () {
    bulk("marker", "color", document.getElementById("b-color").value);
  });

  document.addEventListener("keydown", function (e) {
    var t = e.target;
    var tag = t && t.tagName;
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (t && t.isContentEditable)) return;

    var meta = e.ctrlKey || e.metaKey;
    if (meta && (e.key === "z" || e.key === "Z")) {
      e.preventDefault();
      if (e.shiftKey) redo(); else undo();
      return;
    }
    if (meta && (e.key === "y" || e.key === "Y")) {
      e.preventDefault();
      redo();
      return;
    }
    if (e.key === "Escape") {
      if (addMode) {
        addMode = false;
        stage.classList.remove("adding");
        status("已取消添加");
      } else {
        selected.clear();
        updateSelectionClasses();
        updatePanel();
      }
      return;
    }
    if (editingId) return;
    if (e.key === "Delete" || e.key === "Backspace") {
      if (selected.size) { e.preventDefault(); deleteSelected(); }
      return;
    }
    if (e.key.indexOf("Arrow") === 0) {
      if (!selected.size) return;
      e.preventDefault();
      var step = e.shiftKey ? 0.1 : 0.01;
      var dx = e.key === "ArrowLeft" ? -step : e.key === "ArrowRight" ? step : 0;
      var dy = e.key === "ArrowUp" ? -step : e.key === "ArrowDown" ? step : 0;
      nudge(dx, dy);
      return;
    }
    if (e.key === "Enter" && selected.size === 1) {
      e.preventDefault();
      startEditing(Array.from(selected)[0]);
      return;
    }
    if (!meta && !e.altKey && e.key.length === 1 && selected.size === 1 && !e.isComposing) {
      e.preventDefault();
      startEditing(Array.from(selected)[0], e.key);
    }
  });

  dpiEl.value = (scene.output && scene.output.dpi) || 300;
  updateUndoButtons();
  renderAll();
})();
</script>
</body>
</html>
