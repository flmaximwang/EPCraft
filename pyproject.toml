[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epcraft"
version = "0.1.0"
description = "Electrophoresis gel labeling and offline densitometry for VectorCraft"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "flmaximwang" }]
keywords = ["electrophoresis", "gel", "densitometry", "vectorcraft", "figure", "skill"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/flmaximwang/EPCraft"

[project.scripts]
epcraft = "epcraft.cli:main"

[tool.setuptools]
packages = ["epcraft"]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
epcraft = [
    "data/*.json",
    "templates/*",
    "fixtures/*.json",
]
